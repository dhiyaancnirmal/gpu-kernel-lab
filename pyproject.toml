[project]
name = "gkl"
version = "0.1.0"
description = "Hand-written CUDA matmul and softmax kernels, benchmarked against cuBLAS"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["gkl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
